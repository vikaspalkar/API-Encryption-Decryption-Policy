[package]
name = "api_encryption_decryption_policy"
version = "1.0.2"
rust-version = "1.83.0"
edition = "2021"
description = "AES-256-CBC encrypt/decrypt policy for Omni(Flex) Gateway, backed by AWS Secrets Manager"

[package.metadata.anypoint]
# This field holds your Anypoint Business Group UUID. The `anypoint-cli-v4
# pdk policy-project build-asset-files` step validates it against the live
# control plane and rejects any value that is not a real org UUID (the nil
# UUID 00000000-... also fails), so there is no viable in-repo placeholder:
# every clone must set this to a real org id before `make build` will run.
# See README Section 4 step 3.
group_id = "00000000-0000-0000-0000-000000000000"
definition_asset_id = "api-encryption-decryption-policy"
implementation_asset_id = "api-encryption-decryption-policy-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- Anypoint PDK (crates.io, 1.6.0+) ------------------------------------
pdk = { version = "1.10.0", features = ["enable_stop_iteration"] }

# --- Serialization --------------------------------------------------------
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
anyhow     = "1.0"

# --- Crypto / encoding / signing -----------------------------------------
aes          = "0.7.5"
block-modes  = "0.8.1"
block-padding = "0.2.1"
base64       = "0.21"
hex          = "0.4"
rand         = "0.8"
getrandom    = "0.2"
hmac         = "0.12"
hkdf         = "0.12"
sha2         = "0.10"
subtle       = "2.5"
chrono       = "0.4"
regex        = "1.11.2"

[dev-dependencies]
pdk-unit = { version = "1.10.0", features = ["enable_stop_iteration"] }

[profile.release]
lto       = true
opt-level = 'z'
strip     = "debuginfo"
